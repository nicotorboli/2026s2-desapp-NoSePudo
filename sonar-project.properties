sonar.projectKey=nicotorboli_2026s2-desapp-NoSePudo
sonar.organization=nosepudo
sonar.projectName=2026s2-desapp-NoSePudo
sonar.sourceEncoding=UTF-8

# --- Que se analiza ---
# .github entra como fuente porque Sonar tiene reglas de seguridad para los workflows.
sonar.sources=backend,frontend/src,.github
sonar.tests=backend,frontend/src

# En Go los tests viven al lado del codigo que prueban, asi que sources y tests
# apuntan a los mismos directorios y se separan por patron de nombre.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Los tests no son codigo de produccion: si no se excluyen aca, Sonar los mide como
# tal y ensucia las metricas de duplicacion.
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/dist/**,**/vendor/**,**/package-lock.json,.specify/**

# --- Cobertura ---
# Sonar no ejecuta los tests: lee el reporte que genera la CI (ver .github/workflows/ci.yml).
sonar.go.coverage.reportPaths=backend/coverage.out

# Cuando el frontend tenga tests, generar lcov y descomentar:
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Quality gate ---
# Sin esto el check de GitHub da verde aunque el quality gate falle.
sonar.qualitygate.wait=true
