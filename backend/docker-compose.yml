version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nsp_postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nsp_db
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d nsp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
