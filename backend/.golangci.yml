version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gocyclo
    - gosec
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
    govet:
      enable-all: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
