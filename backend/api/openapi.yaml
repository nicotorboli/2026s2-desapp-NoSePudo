openapi: 3.1.0

info:
  title: NoSePudo API
  version: 0.2.0
  description: |
    REST API of the NoSePudo backend.

    `internal/server` has a test that reads this file and compares its paths and
    their `x-access-level` against the route table this assures that no endpoint goes undocumented as it fails on the build.

    Every endpoint declares an access level, corresponding to the `x-access-level` extension on each
    operation.

    Access levels:

      - `anonymous`     no credential required
      - `authenticated` a valid access token (`typ: access`)
      - `renewal`       a valid refresh token (`typ: refresh`), and nothing else
      - `superuser`     a valid access token whose `priv` claim is `superuser`
servers:
  - url: /
    description: Same origin as whatever is serving this documentation page

tags:
  - name: auth
    description: Account creation, sign-in, session renewal and sign-out
  - name: players
    description: The player catalog
  - name: sync
    description: Scheduled and manual synchronization runs

paths:

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      operationId: registerAccount
      x-access-level: anonymous
      description: |
        Creates a common-user account. The request body has no privilege field, and
        unknown fields are refused, so a client cannot register a
        superuser under any circumstance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: The identifier is already in use. The existing account is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email already registered
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in and receive a session
      operationId: login
      x-access-level: anonymous
      description: |
        Exchanges an email and a password for a short-lived access token and a
        longer-lived refresh token. A wrong password and an unknown account produce
        the same response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: |
            The credentials do not match an account. Returned identically whether the
            password was wrong or no such account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new session
      operationId: refreshSession
      x-access-level: renewal
      description: |
        Takes the **refresh** token in the `Authorization` header — an access token
        presented here is refused. The presented refresh token is invalidated
        and replaced in the same transaction.

        Presenting a token that was **already used** revokes every live refresh token of
        the account: the legitimate holder already exchanged it, so whoever
        presents it now is a second holder, and that is read as theft.

        Presenting one that was **revoked by signing out** is refused and nothing else.
        The requirement says "used or invalidated", but the story's fourth scenario says only
        "used", and the spec's edge case requires two sessions to be independent — a
        phone retrying a renewal after signing out cannot take down the desktop's
        session. A revoked token reappearing is the same client retrying, which is not
        evidence of a second holder.
      security:
        - refreshToken: []
      responses:
        '200':
          description: A new session was issued and the presented token was invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: |
            The token is missing, malformed, not a refresh token, expired, already used
            or already revoked. Every one of those answers identically: the body is the
            same in all cases, so a caller cannot tell which of them applied. Whether
            the account's other credentials were also revoked is an internal
            consequence and is not disclosed either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: authentication required
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      operationId: logout
      x-access-level: authenticated
      description: |
        Ends the session the caller is signed in with, and only that one. Takes no body:
        the access token carries a `sid` claim naming its session family, so the server
        already knows which refresh token to revoke and does not have to accept — and
        therefore validate and distrust — one from the client.

        Another session of the same account is unaffected: signing out on one device does
        not sign the account out on another. The access token is not invalidated and
        expires on its own.
      security:
        - accessToken: []
      responses:
        '204':
          description: |
            The session's refresh token was revoked. Also returned when it had already
            been revoked or had expired — signing out twice is not an error.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /players:
    get:
      tags: [players]
      summary: List the player catalog
      operationId: listPlayers
      x-access-level: anonymous
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, default: 20}}
        - {name: league, in: query, description: League code (e.g. PL), schema: {type: string}}
        - {name: club, in: query, schema: {type: string}}
        - {name: position, in: query, schema: {type: string}}
        - {name: search, in: query, description: Substring of the player name, schema: {type: string}}
        - {name: includeInactive, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: One page of the catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPage'
        '400':
          description: A query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /players/ranking:
    get:
      tags: [players]
      summary: Rank the players by their current score
      operationId: getPlayersRanking
      x-access-level: anonymous
      security:
        - accessToken: []
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: sort, in: query, schema: {type: string, enum: [name, score_asc, score_desc], default: score_desc}}
        - {name: league, in: query, description: League code (e.g. PL), schema: {type: string}}
        - {name: club, in: query, schema: {type: string}}
        - {name: position, in: query, schema: {type: string}}
        - {name: search, in: query, description: Substring of the player name, schema: {type: string}}
        - {name: includeInactive, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: A page of the ranking, sorted as requested. Players without a score keep a null score and sort last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerRankingPage'
        '400':
          description: A query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /players/{id}:
    get:
      tags: [players]
      summary: Get one player of the catalog
      operationId: getPlayer
      x-access-level: anonymous
      security:
        - accessToken: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetail'
        '400':
          description: The id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No player has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: player not found
        '500':
          $ref: '#/components/responses/InternalError'

  /players/{id}/statistics:
    get:
      tags: [players]
      summary: Get the statistics snapshots of one player
      operationId: getPlayerStatistics
      x-access-level: anonymous 
      description: |
        Returns the statistics snapshots of the player, newest first. Statistics
        are append-only: each synchronization run adds one row per player, so a
        player can have several snapshots and none is ever updated in place.
      security:
        - accessToken: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: The player's statistics snapshots, newest first. Empty when the player has no statistics yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStatisticsItem'
        '400':
          description: The id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No player has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: player not found
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/{type}/runs:
    post:
      tags: [sync]
      summary: Trigger a synchronization run manually
      operationId: createSyncRun
      x-access-level: superuser
      description: |
        Creates a run for the given type and starts it in the background. Returns
        the run as `running`, or as `skipped` when a run of the same type is
        already in progress. `progress` is ephemeral: present only while the run
        is running, never persisted.
      security:
        - accessToken: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [players, statistics]}}
      responses:
        '202':
          description: The run was accepted and started, or skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/runs:
    get:
      tags: [sync]
      summary: List synchronization runs
      operationId: listSyncRuns
      x-access-level: superuser
      description: |
        Returns runs newest first, optionally filtered by type.
      security:
        - accessToken: []
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [players, statistics]}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/runs/{id}:
    get:
      tags: [sync]
      summary: Get one synchronization run
      operationId: getSyncRun
      x-access-level: superuser
      security:
        - accessToken: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: The run, with ephemeral progress while it is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '400':
          description: The id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No run has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/schedules:
    get:
      tags: [sync]
      summary: List synchronization schedules
      operationId: listSyncSchedules
      x-access-level: superuser
      security:
        - accessToken: []
      responses:
        '200':
          description: The schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncSchedule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/schedules/{type}:
    put:
      tags: [sync]
      summary: Update one synchronization schedule
      operationId: updateSyncSchedule
      x-access-level: superuser
      security:
        - accessToken: []
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [players, statistics]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSyncScheduleRequest'
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSchedule'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The schedule type does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /scoring/strategies:
    get:
      tags: [scoring]
      summary: List the available scoring strategies
      operationId: listScoringStrategies
      x-access-level: anonymous
      security:
        - accessToken: []
      responses:
        '200':
          description: The available scoring strategies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoringStrategy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /scoring/active-strategy:
    get:
      tags: [scoring]
      summary: Get the active scoring strategy
      operationId: getActiveScoringStrategy
      x-access-level: anonymous
      security:
        - accessToken: []
      responses:
        '200':
          description: The active scoring strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveScoringStrategy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No strategy has been activated yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [scoring]
      summary: Activate a scoring strategy
      operationId: activateScoringStrategy
      x-access-level: superuser
      description: |
        Records the activation and recalculates the scores that were not yet computed
        for the chosen strategy with the current statistics.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateStrategyRequest'
      responses:
        '200':
          description: The activated strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveScoringStrategy'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /scoring/league-coefficients/{league}:
    get:
      tags: [scoring]
      summary: Get the coefficient of one league
      operationId: getLeagueCoefficient
      x-access-level: anonymous
      security:
        - accessToken: []
      parameters:
        - {name: league, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: |
            The league coefficient. When no explicit coefficient has been set,
            returns the default 1.0 with `effectiveFrom: null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueCoefficient'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [scoring]
      summary: Set the coefficient of one league
      operationId: setLeagueCoefficient
      x-access-level: superuser
      description: |
        Stores a new coefficient for the league (append-only). The coefficient is applied
        on read and does not trigger a score recalculation.
      security:
        - accessToken: []
      parameters:
        - {name: league, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLeagueCoefficientRequest'
      responses:
        '200':
          description: The stored league coefficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueCoefficient'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /players/{id}/score:
    get:
      tags: [scoring]
      summary: Get the current score of one player
      operationId: getPlayerScore
      x-access-level: anonymous
      security:
        - accessToken: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: The current score with the league coefficient applied on read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerScore'
        '400':
          description: The id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The player or their score was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /players/{id}/scores:
    get:
      tags: [scoring]
      summary: Get the score history of one player
      operationId: getPlayerScoreHistory
      x-access-level: anonymous
      security:
        - accessToken: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: The score snapshots of the player, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerScore'
        '400':
          description: The id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No player has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/buy:
    post:
      tags: [market]
      summary: Place a buy order
      operationId: placeBuyOrder
      x-access-level: authenticated
      description: |
        Reserves `quantity * price` from the caller's available balance, then crosses
        against resting sell orders of the player priced at or below the order price,
        cheapest first and, at equal price, oldest first. The caller's own resting
        orders are skipped. Each execution is priced at the resting order's price and
        the difference against the reservation is released back.

        The remainder follows `timeInForce`: GTC leaves it resting with its reservation
        held, IOC cancels it and releases the reservation, FOK rejects the whole order
        with HTTP 409 and leaves no state at all.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order accepted, with whatever it executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Player not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The order could not be executed in full and its time in force forbids a remainder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Insufficient available balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/sell:
    post:
      tags: [market]
      summary: Place a sell order
      operationId: placeSellOrder
      x-access-level: authenticated
      description: |
        Reserves the tokens from the caller's available position, then crosses against
        resting buy orders of the player priced at or above the order price, most
        expensive first and, at equal price, oldest first. Remainder handling and
        execution pricing mirror the buy side.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order accepted, with whatever it executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Player not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The order could not be executed in full and its time in force forbids a remainder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Insufficient available token position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders:
    get:
      tags: [market]
      summary: List the caller's live orders
      operationId: listOpenOrders
      x-access-level: authenticated
      description: |
        Returns only the caller's own orders that are still live, that is PENDING or
        PARTIALLY_FILLED. Final orders are not returned here; executed trades are in
        the transaction history instead.
      security:
        - accessToken: []
      parameters:
        - name: playerId
          in: query
          required: false
          description: Restrict the listing to one player
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The caller's live orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenOrderList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}:
    delete:
      tags: [market]
      summary: Cancel a live order
      operationId: cancelOrder
      x-access-level: authenticated
      description: |
        Cancels a live order of the caller and releases the reservation covering its
        remaining quantity. Already executed quantity is untouched. An order that is
        already final cannot be cancelled.
      security:
        - accessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Order cancelled and reservation released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The order is already filled or cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/portfolio:
    get:
      tags: [market]
      summary: Portfolio of a user
      operationId: getUserPortfolio
      x-access-level: authenticated
      description: |
        Cash balance and token positions with their average purchase price, current
        valuation and unrealized result. A regular user may read only their own
        portfolio; the superuser may read any.

        Position quantities include tokens reserved by a live sell order, because
        those are still owned. Reserved cash is reported separately from available
        cash so that a balance partly committed to live orders is legible.
      security:
        - accessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The user's portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/transactions:
    get:
      tags: [market]
      summary: Executed operations of a user
      operationId: getUserTransactions
      x-access-level: authenticated
      description: |
        Executed trades, newest first, one entry per execution. The side is reported
        from the requested user's perspective. A regular user may read only their own
        history; the superuser may read any.
      security:
        - accessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The user's executed operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access token>`. HS256, `typ: access`, and a `sid` claim
        naming the session family it belongs to. Anything that is not exactly
        `Bearer <token>` — no scheme, an empty value, an unknown scheme — is refused
        rather than interpreted.
    refreshToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <refresh token>`. HS256, `typ: refresh`. Accepted only by
        `/auth/refresh`; every other endpoint refuses it.

  responses:
    ValidationFailed:
      description: |
        The request body is malformed, is missing a required field, carries a field the
        endpoint does not expect, or holds a value outside its allowed range. Nothing
        was read from or written to persistence. The message names what was wrong and
        never echoes a submitted secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingField:
              value:
                error: 'field "email" is required'
            unknownField:
              value:
                error: 'unknown field "privilege"'
            outOfRange:
              value:
                error: 'field "password" must be between 8 and 72 characters'
    Unauthenticated:
      description: |
        No credential, an unverifiable or altered credential, an expired credential, or
        a credential of the wrong kind. Refused before any business logic runs and
        before persistence is touched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: authentication required
    Forbidden:
      description: |
        The caller is authenticated but their privilege level does not meet what the
        operation requires. Deliberately distinct from 401: a caller has to be
        able to tell "you are not signed in" from "you are signed in but not allowed".

        Returned by the operations declared `superuser` (for example, the `/sync`
        endpoints and `PUT /scoring/active-strategy`).
        An absent or unrecognised privilege level lands here too, never on the
        permitted side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient privilege
    InternalError:
      description: |
        An unexpected failure. The response carries no detail; the cause is in the log
        event that shares this request's correlation identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal Server Error

  schemas:

    PlaceOrderRequest:
      type: object
      description: |
        `price` and `timeInForce` are optional and interact: omitting the price prices
        the order at the player's active quote and defaults the time in force to FOK,
        while providing a price defaults it to GTC.
      required: [playerId, quantity]
      properties:
        playerId: {type: integer, format: int64, minimum: 1, example: 7}
        quantity: {type: integer, format: int64, minimum: 1, example: 10}
        price:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.0001
          description: Limit price in credits. Omitted means the player's active quote.
          example: 1.0
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'

    TimeInForce:
      type: string
      description: |
        What happens to the part of the order that could not execute.
        GTC leaves it resting until cancelled, IOC cancels it and releases its
        reservation, FOK rejects the entire order unless it executes in full.
      enum: [GTC, IOC, FOK]

    OrderSide:
      type: string
      enum: [BUY, SELL]

    OrderStatus:
      type: string
      description: |
        Live states are PENDING and PARTIALLY_FILLED; final states are FILLED and
        CANCELLED. An order rejected in full is never recorded and never has a status.
      enum: [PENDING, PARTIALLY_FILLED, FILLED, CANCELLED]

    Execution:
      type: object
      description: One match of the order against a counterparty, priced at the resting order's price.
      required: [quantity, price, totalAmount, executedAt]
      properties:
        quantity: {type: integer, format: int64, example: 4}
        price: {type: number, example: 1.0}
        totalAmount: {type: number, example: 4.0}
        executedAt: {type: string, format: date-time}

    OrderResponse:
      type: object
      required:
        - id
        - side
        - playerId
        - price
        - quantity
        - executedQuantity
        - remainingQuantity
        - timeInForce
        - status
        - createdAt
        - trades
      properties:
        id: {type: integer, format: int64}
        side: {$ref: '#/components/schemas/OrderSide'}
        playerId: {type: integer, format: int64}
        price: {type: number, example: 1.0}
        quantity: {type: integer, format: int64, example: 10}
        executedQuantity: {type: integer, format: int64, example: 10}
        remainingQuantity: {type: integer, format: int64, example: 0}
        timeInForce: {$ref: '#/components/schemas/TimeInForce'}
        status: {$ref: '#/components/schemas/OrderStatus'}
        createdAt: {type: string, format: date-time}
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Execution'

    OpenOrder:
      type: object
      required:
        - id
        - side
        - playerId
        - price
        - quantity
        - executedQuantity
        - remainingQuantity
        - timeInForce
        - status
        - createdAt
      properties:
        id: {type: integer, format: int64}
        side: {$ref: '#/components/schemas/OrderSide'}
        playerId: {type: integer, format: int64}
        price: {type: number}
        quantity: {type: integer, format: int64}
        executedQuantity: {type: integer, format: int64}
        remainingQuantity: {type: integer, format: int64}
        timeInForce: {$ref: '#/components/schemas/TimeInForce'}
        status: {$ref: '#/components/schemas/OrderStatus'}
        createdAt: {type: string, format: date-time}

    OpenOrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenOrder'

    CancelOrderResponse:
      type: object
      description: |
        Exactly one of the released fields is present, matching the cancelled order's
        side: credits for a buy order, tokens for a sell order.
      required: [id, status]
      properties:
        id: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/OrderStatus'}
        releasedCredits: {type: number, example: 30.0}
        releasedTokens: {type: integer, format: int64, example: 30}

    PortfolioPosition:
      type: object
      required:
        - playerId
        - playerName
        - clubName
        - position
        - quantity
        - averagePrice
        - currentPrice
        - currentValuation
        - unrealizedResult
      properties:
        playerId: {type: integer, format: int64, example: 7}
        playerName: {type: string, example: Bukayo Saka}
        clubName: {type: string, example: Arsenal FC}
        position: {type: string, example: Offence}
        quantity:
          type: integer
          format: int64
          description: Tokens owned, including those reserved by a live sell order.
          example: 20
        averagePrice: {type: number, example: 1.5}
        currentPrice: {type: number, example: 2.0}
        currentValuation: {type: number, example: 40.0}
        unrealizedResult: {type: number, example: 10.0}

    PortfolioResponse:
      type: object
      required:
        - userId
        - availableCash
        - reservedCash
        - tokensValuation
        - totalValue
        - unrealizedResult
        - positions
      properties:
        userId: {type: integer, format: int64}
        availableCash: {type: number, example: 960.0}
        reservedCash:
          type: number
          description: Credits committed by live buy orders and therefore not spendable.
          example: 0.0
        tokensValuation: {type: number, example: 40.0}
        totalValue: {type: number, example: 1000.0}
        unrealizedResult: {type: number, example: 10.0}
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioPosition'

    Transaction:
      type: object
      required: [id, side, playerId, playerName, quantity, price, totalAmount, executedAt]
      properties:
        id: {type: integer, format: int64}
        side:
          allOf:
            - $ref: '#/components/schemas/OrderSide'
          description: The side from the requested user's perspective.
        playerId: {type: integer, format: int64}
        playerName: {type: string}
        quantity: {type: integer, format: int64}
        price: {type: number}
        totalAmount: {type: number}
        executedAt: {type: string, format: date-time}

    TransactionPage:
      type: object
      required: [items, total, page, limit, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total: {type: integer, format: int64}
        page: {type: integer}
        limit: {type: integer}
        totalPages: {type: integer}

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Trimmed and lowercased before it is stored and before it is looked up, so
            one address cannot become two accounts.
          example: participante@nosepudo.ar
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: |
            The upper bound is bcrypt's: it ignores anything past byte 72, so a longer
            password would silently collide with its own prefix.
          writeOnly: true

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: participante@nosepudo.ar
        password:
          type: string
          format: password
          writeOnly: true

    AccountResponse:
      type: object
      description: |
        The created account. It carries no password in any form, and no privilege level
        either — a self-registered account is always a common user, and stating it in
        the response would invite a client to believe it could be otherwise.
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          format: email
          example: participante@nosepudo.ar

    SessionResponse:
      type: object
      description: |
        A structured object rather than a bare token string, so that later deliveries
        can add fields without breaking existing clients.
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at]
      properties:
        access_token:
          type: string
          description: |
            HS256 JWT, `typ: access`, carrying the `sid` of its session family.
            Presented as a bearer credential.
        refresh_token:
          type: string
          description: |
            HS256 JWT, `typ: refresh`. Single-use: exchanging it invalidates it and
            returns its replacement.
        token_type:
          type: string
          const: Bearer
        access_expires_at:
          type: string
          format: date-time
          description: RFC 3339. The instant the access token stops being accepted.
        refresh_expires_at:
          type: string
          format: date-time
          description: RFC 3339. After this the account holder signs in again.
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type: Bearer
        access_expires_at: '2026-09-28T14:15:00Z'
        refresh_expires_at: '2026-10-05T14:00:00Z'

    Player:
      type: object
      description: A player as listed in the catalog.
      required: [id, name, club, league, position]
      properties:
        id: {type: integer, format: int64, example: 7}
        name: {type: string, example: Bukayo Saka}
        club: {type: string, example: Arsenal FC}
        league: {type: string, example: Premier League}
        position: {type: string, example: Offence}

    PlayerPage:
      type: object
      required: [items, total, page, limit, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        total: {type: integer, format: int64}
        page: {type: integer}
        limit: {type: integer}
        totalPages: {type: integer}

    PlayerDetail:
      type: object
      required: [id, externalId, name, club, league, leagueCode, position, active, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        externalId: {type: integer, format: int64, description: Identifier in football-data.org}
        name: {type: string}
        club: {type: string}
        league: {type: string}
        leagueCode: {type: string, example: PL}
        position: {type: string}
        dateOfBirth: {type: [string, 'null'], format: date, example: '2001-09-05'}
        nationality: {type: [string, 'null']}
        shirtNumber: {type: [integer, 'null']}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    SyncRunProgress:
      type: object
      required: [current, total, message]
      properties:
        current: {type: integer, description: Current league being processed}
        total: {type: integer, description: Total leagues to process}
        message: {type: string}

    SyncRun:
      type: object
      required: [id, type, trigger, status, startedAt]
      properties:
        id: {type: integer, format: int64}
        type: {type: string, enum: [players, statistics]}
        trigger: {type: string, enum: [cron, manual]}
        status: {type: string, enum: [running, succeeded, partial, failed, skipped]}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        totalProcessed: {type: integer}
        totalUpdated: {type: integer}
        totalDeactivated: {type: integer}
        totalMatched: {type: integer}
        totalUnmatched: {type: integer}
        totalInserted: {type: integer}
        message: {type: string}
        error: {type: string}
        triggeredBy: {type: [integer, 'null'], format: int64}
        progress:
          anyOf:
            - $ref: '#/components/schemas/SyncRunProgress'
            - type: 'null'
          description: Present only while the run is running.

    SyncRunPage:
      type: object
      required: [items, offset, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
        offset: {type: integer}
        limit: {type: integer}
        total: {type: integer}

    SyncSchedule:
      type: object
      required: [type, enabled, intervalMinutes, nextRunAt, updatedAt]
      properties:
        type: {type: string, enum: [players, statistics]}
        enabled: {type: boolean}
        intervalMinutes: {type: integer, minimum: 15}
        nextRunAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: [integer, 'null'], format: int64}

    UpdateSyncScheduleRequest:
      type: object
      additionalProperties: false
      required: [enabled, intervalMinutes]
      properties:
        enabled: {type: boolean}
        intervalMinutes: {type: integer, minimum: 15, maximum: 43200}

    PlayerStatisticsItem:
      type: object
      required: [createdAt, goals, assists, shots, keyPasses, dribbles, tackles, interceptions, fouls, clears, blocks, wasDribbled, rating]
      properties:
        createdAt: {type: string, format: date-time, description: When this snapshot was scraped}
        goals: {type: integer, description: Season total}
        assists: {type: integer, description: Season total}
        shots: {type: number, format: double, description: Per game}
        keyPasses: {type: number, format: double, description: Per game}
        dribbles: {type: number, format: double, description: Successful dribbles per game}
        tackles: {type: number, format: double, description: Per game}
        interceptions: {type: number, format: double, description: Per game}
        fouls: {type: number, format: double, description: Per game}
        clears: {type: number, format: double, description: Per game}
        blocks: {type: number, format: double, description: Outfielder blocks per game}
        wasDribbled: {type: number, format: double, description: Times dribbled past per game}
        rating: {type: number, format: double}

    Error:
      type: object
      description: |
        The single error shape the HTTP wrapper emits. One field, so that a client has
        exactly one thing to read and no error path can leak a value that was not meant
        for it.
      required: [error]
      properties:
        error:
          type: string

    ScoringStrategy:
      type: object
      required: [id, name, alpha, weights]
      properties:
        id: {type: integer}
        name: {type: string}
        alpha: {type: number, format: double, minimum: 0, maximum: 1, description: Weight of the rating term in the score formula}
        weights:
          type: object
          description: Weight per position and statistic.
          additionalProperties:
            type: object
            additionalProperties: {type: number, format: double}

    ActiveScoringStrategy:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}

    ActivateStrategyRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: integer}

    LeagueCoefficient:
      type: object
      required: [leagueCode, coefficient]
      properties:
        leagueCode: {type: string, example: PL}
        coefficient: {type: number, format: double, example: 1.0}
        effectiveFrom:
          type: [string, 'null']
          format: date-time
          description: |
            When the coefficient was stored. `null` means no explicit coefficient
            exists and the default 1.0 applies.

    SetLeagueCoefficientRequest:
      type: object
      additionalProperties: false
      required: [coefficient]
      properties:
        coefficient: {type: number, format: double, exclusiveMinimum: 0}

    PlayerScore:
      type: object
      required: [playerId, computedAt, strategyId, strategyName, rawScore, percentile, score, leagueCoefficient]
      properties:
        playerId: {type: integer, format: int64}
        computedAt: {type: string, format: date-time}
        strategyId: {type: integer}
        strategyName: {type: string}
        rawScore: {type: number, format: double}
        percentile: {type: number, format: double, minimum: 0, maximum: 1}
        score: {type: number, format: double, minimum: 0, maximum: 1}
        leagueCoefficient: {type: number, format: double}

    PlayerRankingItem:
      type: object
      required: [id, name, club, league, position]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        club: {type: string}
        league: {type: string}
        position: {type: string}
        score: {type: [number, "null"], format: double, minimum: 0}

    PlayerRankingPage:
      type: object
      required: [items, offset, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerRankingItem'
        offset: {type: integer}
        limit: {type: integer}
        total: {type: integer}
